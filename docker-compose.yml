services:
  api:
    build: .
    command: sh -c "until alembic upgrade head; do echo 'Waiting for db...'; sleep 3; done && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8080:8000"
    env_file: .env
    volumes:
      - ./app:/code/app
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info -Q ingestion
    env_file: .env
    volumes:
      - ./app:/code/app
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    #ports:
      #- "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    #ports:
     # - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  qdrant_data:
  uploads: