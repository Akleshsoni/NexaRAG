# Local development stack. `api` and `worker` mount ./app for live edits and the API
# runs with --reload; for a deployment remove those mounts and the --reload flag.
services:
  api:
    build: .
    command: sh -c "until alembic upgrade head; do echo 'Waiting for db...'; sleep 3; done && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8080:8000"
    env_file: .env
    volumes:
      - ./app:/code/app
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: on-failure

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info -Q ingestion
    env_file: .env
    volumes:
      - ./app:/code/app
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: on-failure

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    # No host port: other local PostgreSQL installs often already use 5432.
    # Uncomment to connect from the host:
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"   # bound to localhost only: Qdrant has no auth here
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  redisdata:
  qdrant_data:
  uploads:
